<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#FF751F" />
    <title>POUP — sem conexão</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: #ffffff;
        color: #0f172a;
        font-family:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        text-align: center;
      }
      .box {
        max-width: 340px;
      }
      img {
        width: 72px;
        height: 72px;
        margin-bottom: 20px;
      }
      h1 {
        font-size: 20px;
        margin: 0 0 8px;
      }
      p {
        font-size: 15px;
        line-height: 1.5;
        color: #64748b;
        margin: 0 0 24px;
      }
      button {
        appearance: none;
        border: 0;
        border-radius: 12px;
        background: #ff751f;
        color: #fff;
        font-size: 16px;
        font-weight: 600;
        padding: 14px 28px;
        cursor: pointer;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #0b1120;
          color: #f8fafc;
        }
        p {
          color: #94a3b8;
        }
      }
    </style>
  </head>
  <body>
    <div class="box">
      <img src="/icon-192.png" alt="POUP" />
      <h1>Sem conexão</h1>
      <p>
        O POUP precisa de internet para carregar seus leads e simulações. Confira o wi-fi ou os
        dados do celular e tente de novo.
      </p>
      <button onclick="location.reload()">Tentar de novo</button>
    </div>
  </body>
</html>
